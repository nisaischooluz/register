<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nis AI Maktabi</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    html, body {
      height: 100%;
      background: url('./image.png') no-repeat center center / cover;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .main-container {
      text-align: center;
      max-width: 430px;
      width: 100%;
    }

    .robot-icon {
      width: 100px;
      height: auto;
      margin: 0 auto 16px;
      display: block;
    }

    .form-wrapper {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 32px 24px;
      width: 100%;
      box-shadow: 0 0 15px rgba(0, 255, 153, 0.4);
      border: 2px solid rgba(255, 255, 255, 0.15);
      color: white;
    }

    .form-wrapper .logo {
      width: 90px;
      height: auto;
      margin: 0 auto 16px;
      display: block;
    }

    .form-wrapper h1 {
      font-size: 20px;
      font-weight: 600;
      color: white;
      margin-bottom: 10px;
    }

    .form-wrapper p {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 24px;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      margin-bottom: 16px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 14px;
      font-size: 15px;
      color: white;
      background-color: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(5px);
    }

    input::placeholder,
    select {
      color: rgba(255, 255, 255, 0.7);
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #00ffc3;
      box-shadow: 0 0 8px #00ffc3;
      background-color: rgba(0, 0, 0, 0.5);
    }

   button {
  width: 100%;
  padding: 14px;
  background-color: #00ffff; /* 🔵 robot rangida */
  border: none;
  border-radius: 14px;
  font-weight: 600;
  font-size: 16px;
  color: #000;
  cursor: pointer;
  box-shadow: 0 0 12px #00ffff, 0 0 24px #00ffff;
  transition: background-color 0.3s ease, box-shadow 0.3s ease;
}

button:hover {
  background-color: #00e0e0; /* hover holat — biroz quyuq */
  box-shadow: 0 0 20px #00ffff, 0 0 30px #00ffff;
}


    @media (max-width: 480px) {
      .robot-icon {
        width: 80px;
        margin-bottom: 12px;
      }

      .form-wrapper {
        padding: 24px 16px;
      }

      .form-wrapper .logo {
        width: 70px;
        margin-bottom: 12px;
      }
    }
  </style>
</head>
<body>

  <div class="main-container">
    <!-- ✅ ROBOT FORM USTIDA, MARKAZDA -->
    <img class="robot-icon" src="robot.png" alt="Robotcha" />

    <div class="form-wrapper">
      <!-- ✅ LOGO FORM ICHIDA -->
      <img class="logo" src="logo.png" alt="Logo" />

      <h1>Qabulga ro‘yxatdan o‘ting</h1>
      <p>Ma’lumotlaringizni yozib qoldiring, siz bilan tezda bog‘lanamiz, maktabimiz haqida yana ham batafsilroq aytib beramiz</p>

      <form id="applicationForm">
        <input type="text" id="name" placeholder="Ismingiz" required />
   <select id="district" required>
  <option value="" disabled selected>Tumanni tanlang</option>
  <option>Namangan shahar</option>
  <option>Davlatobod tumani</option>
  <option>Yangi Namangan tumani</option>
  <option>Namangan tumani</option>
  <option>Chortoq tumani</option>
  <option>Chust tumani</option>
  <option>Kosonsoy tumani</option>
  <option>Mingbuloq tumani</option>
  <option>Norin tumani</option>
  <option>Pop tumani</option>
  <option>To‘raqo‘rg‘on tumani</option>
  <option>Uychi tumani</option>
  <option>Uchqo'rg'on tumani</option>
  <option>Yangiqo‘rg‘on tumani</option>
  <option>Boshqa hudud</option>

     

</select>


     <select id="grade" required>
  <option value="" disabled selected>Sinfni tanlang</option>
  <option>1-sinf</option>
  <option>2-sinf</option>
  <option>3-sinf</option>
  <option>4-sinf</option>
  <option>5-sinf</option>
  <option>6-sinf</option>
  <option>7-sinf</option>
  <option>8-sinf</option>
  <option>9-sinf</option>
  <option>10-sinf</option>
  <option>11-sinf</option>
</select>


        <input type="tel" id="phone" placeholder="+998 99 999-9999" required />
        <button type="submit">Ariza topshirish</button>
      </form>
    </div>
  </div>

  <script>
  const BOT_TOKEN = '7844045998:AAEUnMvDouU4BiZi6JBEEGWmqdyPHgy9lKE';
  const CHAT_ID = '-1002569930465';

  document.getElementById('applicationForm').addEventListener('submit', function (e) {
    e.preventDefault();

    // Ma’lumotlarni olish
    const name = document.getElementById('name').value.trim();
    const district = document.getElementById('district').value;
    const grade = document.getElementById('grade').value;
    const phone = document.getElementById('phone').value.trim();

    // Telefon formatini tekshirish: +998 XX XXX-XX-XX
    const phoneRegex = /^\+998\s?\d{2}\s?\d{3}-?\d{2}-?\d{2}$/;
    if (!phoneRegex.test(phone)) {
      alert("❌ Telefon raqami noto‘g‘ri. To‘g‘ri format: +998 90 123-45-67");
      return;
    }

    // Bo‘sh joylarni tekshirish
    if (!name || !district || !grade || !phone) {
      alert("❗️ Iltimos, barcha maydonlarni to‘ldiring.");
      return;
    }

    // Telegramga yuboriladigan matn
    const message = `
📥 <b>Yangi ariza!</b>

👤 <b>Ism:</b> ${name}
📍 <b>Tuman:</b> ${district}
🏫 <b>Sinf:</b> ${grade}
📞 <b>Telefon:</b> ${phone}
    `.trim();

    // Telegram API orqali yuborish
    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        chat_id: CHAT_ID,
        text: message,
        parse_mode: 'HTML'
      })
    })
    .then(res => {
      if (res.ok) {
        alert("✅ Arizangiz muvaffaqiyatli yuborildi!");
        document.getElementById('applicationForm').reset();
      } else {
        alert("❌ Botga yuborishda xatolik yuz berdi.");
      }
    })
    .catch(err => {
      alert("❌ Internet bilan bog‘liq muammo yoki noto‘g‘ri token.");
      console.error(err);
    });
  });
</script>

</body>
</html>
